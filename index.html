<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ALPHA WORKOUT</title>
<style>
:root{
  --bg:#000000;
  --panel:#121212;
  --panel2:#1b1b1b;
  --border:#2a2a2a;
  --green:#39ff14;
  --green-dim:#1f8f0c;
  --yellow:#ffe600;
  --yellow-dim:#b3a000;
  --text:#e8e8e8;
  --text-dim:#9a9a9a;
  --danger:#ff5252;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Arial,sans-serif; height:100%; width:100%; -webkit-tap-highlight-color:transparent;}
body{min-height:100vh; overflow-x:hidden;}
#app-root{width:100%; min-height:100vh; position:relative; background:var(--bg); display:flex; flex-direction:column;}

/* ---------- Splash ---------- */
#splash{
  position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #0d0d0d 0%, #000 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999;
  transition:opacity .5s ease;
}
#splash.fade-out{opacity:0; pointer-events:none;}
.splash-logo{font-size:42px; font-weight:900; letter-spacing:3px; text-align:center;}
.splash-logo .alpha{color:var(--green); text-shadow:0 0 18px rgba(57,255,20,.6);}
.splash-logo .workout{color:var(--yellow); text-shadow:0 0 18px rgba(255,230,0,.5);}
.splash-sub{margin-top:10px; color:var(--text-dim); letter-spacing:4px; font-size:11px;}
.splash-bar-track{margin-top:28px; width:180px; height:4px; background:#222; border-radius:2px; overflow:hidden;}
.splash-bar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--green),var(--yellow)); animation:loadbar 2s linear forwards;}
@keyframes loadbar{ to{width:100%;} }

/* ---------- Private mode banner ---------- */
#private-banner{
  display:none; width:100%; background:var(--yellow); color:#000; font-weight:700; font-size:12.5px;
  text-align:center; padding:8px 14px;
}

/* ---------- Point scored animation ---------- */
#point-toast{
  position:fixed; top:76px; left:50%; transform:translate(-50%,-14px) scale(.8);
  background:linear-gradient(135deg,var(--green),var(--yellow)); color:#000; font-weight:900; font-size:22px;
  padding:14px 28px; border-radius:14px; box-shadow:0 0 34px rgba(57,255,20,.65); opacity:0;
  z-index:300; pointer-events:none; letter-spacing:1px; white-space:nowrap;
}
#point-toast.show{ animation: pointpop 2.6s ease forwards; }
@keyframes pointpop{
  0%{ opacity:0; transform:translate(-50%,-10px) scale(.8); }
  8%{ opacity:1; transform:translate(-50%,0) scale(1.08); }
  15%{ opacity:1; transform:translate(-50%,0) scale(1); }
  85%{ opacity:1; transform:translate(-50%,0) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-16px) scale(.95); }
}

/* ---------- Header ---------- */
#header{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; background:#000; border-bottom:1px solid var(--border); width:100%;
}
#header .brand{font-weight:900; letter-spacing:1px; font-size:18px; cursor:pointer;}
#header .brand .a{color:var(--green);}
#header .brand .w{color:var(--yellow);}
#hamburger-btn{background:none; border:1px solid var(--border); border-radius:8px; width:40px; height:36px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; cursor:pointer;}
#hamburger-btn span{display:block; width:20px; height:2px; background:var(--green);}

/* ---------- Slide menu ---------- */
#menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none;}
#menu-overlay.open{display:block;}
#side-menu{
  position:fixed; top:0; right:-300px; width:280px; height:100%; background:#0a0a0a; border-left:1px solid var(--border);
  z-index:90; transition:right .25s ease; display:flex; flex-direction:column; padding:18px;
}
#side-menu.open{right:0;}
#side-menu h3{color:var(--yellow); font-size:13px; letter-spacing:2px; margin-bottom:14px;}
.menu-item{
  display:flex; align-items:center; justify-content:space-between; padding:14px 10px; border-radius:8px; margin-bottom:6px;
  cursor:pointer; color:var(--text); border:1px solid transparent;
}
.menu-item:hover{background:var(--panel2); border-color:var(--border);}
.menu-item .arrow{color:var(--green);}
.menu-close{align-self:flex-end; background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; margin-bottom:6px;}

/* ---------- Content ---------- */
#app-content{flex:1; width:100%; max-width:1400px; margin:0 auto; padding:20px 24px 60px;}
.page-title{font-size:20px; font-weight:800; color:var(--green); margin-bottom:4px;}
.page-sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
.card h4{color:var(--yellow); font-size:15px; margin-bottom:2px;}
.tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--green); color:var(--green); margin-top:4px;}
.tag.done{background:var(--green); color:#000; border-color:var(--green); font-weight:700;}
.meta-row{display:flex; gap:14px; font-size:12px; color:var(--text-dim); margin:6px 0 10px; flex-wrap:wrap;}
.meta-row b{color:var(--text);}
.set-row{display:grid; grid-template-columns:36px 1fr 1fr; gap:8px; align-items:center; margin-bottom:6px;}
.set-row span{color:var(--text-dim); font-size:12px;}
input[type=number], input[type=text], input[type=date]{
  width:100%; background:#0e0e0e; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font-size:14px;
}
input:focus{outline:1px solid var(--green);}
.btn{
  background:linear-gradient(90deg,var(--green),var(--yellow)); color:#000; border:none; border-radius:8px;
  padding:10px 14px; font-weight:800; cursor:pointer; font-size:13px; letter-spacing:.5px;
}
.btn.secondary{background:none; border:1px solid var(--green); color:var(--green);}
.btn.small{padding:6px 10px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.pill-group{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.pill{padding:7px 12px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); font-size:12px; cursor:pointer;}
.pill.active{border-color:var(--green); color:var(--green); font-weight:700;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
.stat-box .num{font-size:24px; font-weight:900;}
.stat-box .lbl{font-size:11px; color:var(--text-dim); margin-top:4px; letter-spacing:1px;}
.pos{color:var(--green);}
.neg{color:var(--yellow);}
.switch{position:relative; width:46px; height:24px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider-el{position:absolute; cursor:pointer; inset:0; background:#333; border-radius:24px; transition:.2s;}
.slider-el:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#ccc; border-radius:50%; transition:.2s;}
input:checked + .slider-el{background:var(--green-dim);}
input:checked + .slider-el:before{transform:translateX(22px); background:var(--green);}
.locked-box{opacity:.5; pointer-events:none;}
.log-entry{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.log-entry:last-child{border-bottom:none;}
.bar-chart{display:flex; align-items:flex-end; gap:4px; height:120px; margin:10px 0; overflow-x:auto;}
.bar{flex:0 0 auto; width:14px; background:linear-gradient(180deg,var(--green),var(--green-dim)); border-radius:3px 3px 0 0; position:relative;}
.bar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9px; color:var(--text-dim);}
.empty-msg{color:var(--text-dim); font-size:13px; text-align:center; padding:24px 0;}
svg.linechart{width:100%; height:140px;}
.footer-note{text-align:center; color:var(--text-dim); font-size:11px; margin-top:20px;}
.badge-locked{font-size:11px; color:var(--yellow); border:1px solid var(--yellow); padding:2px 8px; border-radius:20px; white-space:nowrap;}
.cards-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:12px;}
@media(min-width:800px){ .cards-grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1300px){ .cards-grid{grid-template-columns:1fr 1fr 1fr;} }
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:#333; border-radius:3px;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo"><span class="alpha">ALPHA</span> <span class="workout">WORKOUT</span></div>
  <div class="splash-sub">TRAIN. TRACK. TRANSFORM.</div>
  <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
</div>

<div id="point-toast"></div>

<div id="app-root" style="display:none;">
  <div id="private-banner">⚠ Private / Incognito browsing detected — entries may not be saved after this window is closed.</div>
  <div id="header">
    <div class="brand" onclick="navigate('home')"><span class="a">ALPHA</span> <span class="w">WORKOUT</span></div>
    <button id="hamburger-btn" onclick="toggleMenu(true)"><span></span><span></span><span></span></button>
  </div>

  <div id="menu-overlay" onclick="toggleMenu(false)"></div>
  <div id="side-menu">
    <button class="menu-close" onclick="toggleMenu(false)">&times;</button>
    <h3>MENU</h3>
    <div class="menu-item" onclick="navigate('progress')"><span>📈 Track Progress</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="navigate('upcoming')"><span>📅 Upcoming Workouts</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="navigate('bodyweight')"><span>⚖️ Body Weight</span><span class="arrow">›</span></div>

    <div class="menu-item" onclick="navigate('settings')"><span>⚙️ Settings</span><span class="arrow">›</span></div>
    <div class="menu-item" onclick="navigate('home')"><span>🏠 Home</span><span class="arrow">›</span></div>
  </div>

  <div id="app-content"></div>
</div>

<script>
/* ============================================================
   ALPHA WORKOUT — single file app, offline-first, dual-persisted
   (localStorage + IndexedDB), points/rewards + tier system
   ============================================================ */

const STORAGE_KEY = 'alphaWorkoutData_v1';
const IDB_NAME = 'AlphaWorkoutDB';
const IDB_STORE = 'state';

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const WORKOUT_PLAN = {

    {id:'wed3', name:'Leg Press', type:'strength', sets:3, reps:'12', rest:'90 sec'},

  ]},
  Thursday: { focus:'Cardio & Core', exercises:[

    {id:'thu2', name:'Hanging Leg Raises', type:'strength', sets:3, reps:'15', rest:'45 sec'},

    {id:'thu4', name:'Plank Hold', type:'strength', sets:3, reps:'60 sec hold', rest:'45 sec'},
    {id:'thu5', name:'Russian Twists', type:'strength', sets:3, reps:'20', rest:'45 sec'},
    {id:'thu6', name:'Bicycle Crunches', type:'strength', sets:3, reps:'20', rest:'45 sec'},
    {id:'thu7', name:'Mountain Climbers (HIIT)', type:'cardio', target:'3 x 30 sec', rest:'30 sec'}
  ]},
  Friday: { focus:'Back (Strength & Thickness) + Biceps', exercises:[
    {id:'fri1', name:'Deadlift', type:'strength', sets:4, reps:'5-6', rest:'150 sec'},
    {id:'fri2', name:'Barbell Bent Over Row', type:'strength', sets:4, reps:'8-10', rest:'90 sec'},

    {id:'fri5', name:'Barbell Bicep Curl', type:'strength', sets:3, reps:'10-12', rest:'60 sec'},
    {id:'fri6', name:'Hammer Curl', type:'strength', sets:3, reps:'12', rest:'60 sec'},

  ]},
  Saturday: { focus:'Shoulders & Triceps', exercises:[
    {id:'sat1', name:'Seated Barbell Shoulder Press', type:'strength', sets:4, reps:'8-10', rest:'90 sec'},
    {id:'sat2', name:'Arnold Press', type:'strength', sets:3, reps:'10', rest:'75 sec'},
    {id:'sat3', name:'Lateral Raises', type:'strength', sets:4, reps:'15', rest:'45 sec'},
    {id:'sat4', name:'Face Pulls', type:'strength', sets:3, reps:'15', rest:'45 sec'},
    {id:'sat5', name:'Close Grip Bench Press', type:'strength', sets:3, reps:'10', rest:'90 sec'},
    {id:'sat6', name:'Tricep Rope Pushdown', type:'strength', sets:3, reps:'12-15', rest:'60 sec'},
    {id:'sat7', name:'Overhead Tricep Extension', type:'strength', sets:3, reps:'12', rest:'60 sec'}
  ]},
  Sunday: { focus:'Rest Day', exercises:[] }
};

/* ---------------- reward constants ---------------- */
const FIRST_ENTRY_BONUS = 10000;
const PER_SET_POINTS = 25;
const PR_REWARD = 2500;
const BODYWEIGHT_LOG_REWARD = 2500;
const BODYWEIGHT_MISS_PENALTY = 5000;
const GAP_PENALTY = 10000;      // 2+ continuous days with no exercise logged
const WEEKLY_MISS_PENALTY = 50000; // fewer than 5 workout days in a Mon-Sun week

const TIERS = [
  { name:'Platinum', min:75000, color:'var(--green)' },
  { name:'Gold',      min:30000, color:'var(--yellow)' },
  { name:'Silver',    min:10000, color:'#c0c0c0' },
  { name:'Bronze',    min:-Infinity, color:'#a97142' }
];

/* ---------------- date utils ---------------- */
function formatDateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDateKey(key){
  const [y,m,d]=key.split('-').map(Number);
  return new Date(y,m-1,d);
}
function dayNameForDate(d){ return DAY_NAMES[d.getDay()]; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function diffDays(a,b){
  const A=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const B=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);
}
function niceDate(key){
  const d=parseDateKey(key);
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}

/* ---------------- data layer (localStorage + IndexedDB dual persistence) ---------------- */
function defaultData(){
  return {
    createdAt: formatDateKey(new Date()),
    updatedAt: Date.now(),
    points: 0,
    pointsLog: [],
    bodyWeight: [],
    workouts: {},
    settings: { allowPastEntries:false },
    penalizedBodyWeightWeeks: [],
    evaluatedWeeks: [],
    gapPenaltyAppliedFor: null,
    forcedBronzeActive: false,
    firstEntryAwarded: false
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed);
  }catch(e){ return defaultData(); }
}
let data = loadData();

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) return reject('no-idb');
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSave(obj){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(obj,'data');
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    });
  }catch(e){ return false; }
}
async function idbLoad(){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get('data');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    });
  }catch(e){ return null; }
}
function persist(){
  data.updatedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  idbSave(data);
}
async function reconcileStorage(){
  const idbData = await idbLoad();
  if(idbData && (idbData.updatedAt||0) > (data.updatedAt||0)){
    data = Object.assign(defaultData(), idbData);
    persist();
    render();
  } else {
    // seed / keep IndexedDB in sync with whatever we currently have
    idbSave(data);
  }
}
function detectPrivateModeAndWarn(){
  try{
    localStorage.setItem('__pmtest__','1');
    localStorage.removeItem('__pmtest__');
  }catch(e){ showPrivateBanner(); return; }
  if(!window.indexedDB){ showPrivateBanner(); return; }
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{
      if(est && est.quota && est.quota < 120000000){ showPrivateBanner(); }
    }).catch(()=>{});
  }
}
function showPrivateBanner(){
  const el = document.getElementById('private-banner');
  if(el) el.style.display='block';
}

function awardPoints(delta, reason){
  data.points += delta;
  data.pointsLog.unshift({ ts: new Date().toISOString(), delta, reason });
  if(data.pointsLog.length>400) data.pointsLog.length=400;
}

/* ---------------- point scored animation ---------------- */
function triggerPointAnimation(total){
  if(!total || total<=0) return;
  const el = document.getElementById('point-toast');
  if(!el) return;
  el.textContent = `+${total.toLocaleString()} PTS`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

/* ---------------- streak & tier ---------------- */
function computeStreak(){
  let count=0;
  let d=new Date(); d.setHours(0,0,0,0);
  while(true){
    const key=formatDateKey(d);
    const w=data.workouts[key];
    if(w && w.entries && Object.keys(w.entries).length>0){
      count++; d=addDays(d,-1);
    } else break;
  }
  return count;
}
function computeTier(){
  if(data.forcedBronzeActive) return TIERS[3];
  return TIERS.find(t=>data.points>=t.min);
}

/* ---------------- penalty engine ---------------- */
function getSundayOfWeek(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay();
  return addDays(d,-day);
}
function getMondayOfWeek(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay();
  const diff = (day===0)? -6 : 1-day;
  return addDays(d,diff);
}
function bodyWeightWindow(sunday){
  // Sunday 6:00 AM through Monday 11:59:59 PM
  const start=new Date(sunday); start.setHours(6,0,0,0);
  const end=addDays(sunday,1); end.setHours(23,59,59,999);
  return {start,end};
}
function hasBodyWeightInWindow(start,end){
  return data.bodyWeight.some(e=>{
    const d=parseDateKey(e.date);
    const dt=new Date(d); dt.setHours(12,0,0,0);
    return dt>=start && dt<=end;
  });
}
function runBodyWeightPenaltyCheck(now){
  const currentSunday = getSundayOfWeek(now);
  const createdAtStart = parseDateKey(data.createdAt); // midnight of account-creation day
  for(let w=11; w>=0; w--){
    const sunday = addDays(currentSunday, -7*w);
    const weekKey = formatDateKey(sunday);
    const {start,end} = bodyWeightWindow(sunday);
    if(start < createdAtStart) continue; // don't penalize windows that began before the account existed
    if(end > now) continue;
    if(data.penalizedBodyWeightWeeks.includes(weekKey)) continue;
    if(!hasBodyWeightInWindow(start,end)){
      data.points -= BODYWEIGHT_MISS_PENALTY;
      data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-BODYWEIGHT_MISS_PENALTY, reason:`Missed body weight window (week of ${weekKey})` });
    }
    data.penalizedBodyWeightWeeks.push(weekKey);
  }
}
function getLastWorkoutLogDate(){
  const keys = Object.keys(data.workouts).filter(k=>data.workouts[k].entries && Object.keys(data.workouts[k].entries).length>0);
  if(keys.length===0) return null;
  keys.sort();
  return parseDateKey(keys[keys.length-1]);
}
function runGapPenaltyCheck(now){
  const last = getLastWorkoutLogDate();
  const baseline = last || parseDateKey(data.createdAt);
  const baselineKey = formatDateKey(baseline);
  const today = new Date(now); today.setHours(0,0,0,0);
  const gap = diffDays(today, baseline);
  if(gap>=2 && data.gapPenaltyAppliedFor !== baselineKey){
    data.points -= GAP_PENALTY;
    data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-GAP_PENALTY, reason:'No exercise logged for 2+ continuous days' });
    data.gapPenaltyAppliedFor = baselineKey;
  }
}
function countLoggedDaysInWeek(monday){
  let count=0;
  for(let i=0;i<7;i++){
    const key=formatDateKey(addDays(monday,i));
    const w=data.workouts[key];
    if(w && w.entries && Object.keys(w.entries).length>0) count++;
  }
  return count;
}
function runWeeklyMinimumCheck(now){
  const currentMonday = getMondayOfWeek(now);
  const createdAtStart = parseDateKey(data.createdAt); // midnight of account-creation day
  for(let w=11; w>=0; w--){
    const monday = addDays(currentMonday, -7*w);
    if(monday < createdAtStart) continue; // don't penalize weeks that started before the account existed
    const weekKey = formatDateKey(monday);
    const weekEnd = addDays(monday,6); weekEnd.setHours(23,59,59,999);
    if(weekEnd > now) continue;
    if(data.evaluatedWeeks.includes(weekKey)) continue;
    const loggedDays = countLoggedDaysInWeek(monday);
    if(loggedDays < 5){
      data.points -= WEEKLY_MISS_PENALTY;
      data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-WEEKLY_MISS_PENALTY, reason:`Missed weekly minimum — only ${loggedDays}/7 days logged (week of ${weekKey})` });
      data.forcedBronzeActive = true;
    } else if(data.forcedBronzeActive){
      data.forcedBronzeActive = false;
    }
    data.evaluatedWeeks.push(weekKey);
  }
}
function runPenaltyChecks(){
  const now = new Date();
  runBodyWeightPenaltyCheck(now);
  runGapPenaltyCheck(now);
  runWeeklyMinimumCheck(now);
  persist();
}

/* ---------------- workout logging ---------------- */
function ensureDayEntry(dateKey){
  if(!data.workouts[dateKey]){
    const dName = dayNameForDate(parseDateKey(dateKey));
    data.workouts[dateKey] = { day: dName, entries: {}, customExercises: [], awarded: {}, prAwarded: {} };
  } else {
    const w = data.workouts[dateKey];
    w.customExercises = w.customExercises || [];
    w.awarded = w.awarded || {};
    w.prAwarded = w.prAwarded || {};
  }
  return data.workouts[dateKey];
}
function checkOverload(exerciseName, dateKey, newMaxWeight){
  let priorMax = -Infinity;
  for(let i=1;i<=7;i++){
    const key = formatDateKey(addDays(parseDateKey(dateKey), -i));
    const w = data.workouts[key];
    if(w && w.entries && w.entries[exerciseName]){
      const m = Math.max(...w.entries[exerciseName].map(s=>Number(s.weight)||0));
      if(m>priorMax) priorMax=m;
    }
  }
  if(priorMax > -Infinity && newMaxWeight > priorMax){
    awardPoints(PR_REWARD, `New PR on ${exerciseName}!`);
    return true;
  }
  return false;
}
function findExerciseDef(exId, dateKey){
  const dayName = dayNameForDate(parseDateKey(dateKey));
  const plan = WORKOUT_PLAN[dayName];
  let ex = plan.exercises.find(e=>e.id===exId);
  if(ex) return ex;
  const dayEntry = data.workouts[dateKey];
  if(dayEntry && dayEntry.customExercises){
    ex = dayEntry.customExercises.find(e=>e.id===exId);
  }
  return ex;
}
function saveExercise(dateKey, exerciseName, type, sets){
  const dayEntry = ensureDayEntry(dateKey);
  dayEntry.entries[exerciseName] = sets;
  let sessionTotal = 0;

  function grantFirstEntryIfNeeded(){
    if(!data.firstEntryAwarded){
      awardPoints(FIRST_ENTRY_BONUS, 'Welcome bonus — first entry logged!');
      sessionTotal += FIRST_ENTRY_BONUS;
      data.firstEntryAwarded = true;
    }
  }

  if(type==='strength'){
    const prevAwarded = dayEntry.awarded[exerciseName] || sets.map(()=>false);
    const newAwarded = sets.map((s,i)=> prevAwarded[i] || (Number(s.weight)>0 || Number(s.reps)>0));
    sets.forEach((s,i)=>{
      const filled = (Number(s.weight)>0 || Number(s.reps)>0);
      if(filled && !prevAwarded[i]){
        grantFirstEntryIfNeeded();
        awardPoints(PER_SET_POINTS, `Set ${i+1} — ${exerciseName}`);
        sessionTotal += PER_SET_POINTS;
      }
    });
    dayEntry.awarded[exerciseName] = newAwarded;
  } else {
    const filled = sets[0] && String(sets[0].value||'').trim().length>0;
    const already = dayEntry.awarded[exerciseName]===true;
    if(filled && !already){
      grantFirstEntryIfNeeded();
      awardPoints(PER_SET_POINTS, `${exerciseName} logged`);
      sessionTotal += PER_SET_POINTS;
      dayEntry.awarded[exerciseName] = true;
    }
  }

  let prTriggered = false;
  if(type==='strength'){
    const maxWeight = Math.max(...sets.map(s=>Number(s.weight)||0), 0);
    if(maxWeight>0 && !dayEntry.prAwarded[exerciseName]){
      const isPR = checkOverload(exerciseName, dateKey, maxWeight);
      if(isPR){
        dayEntry.prAwarded[exerciseName] = true;
        sessionTotal += PR_REWARD;
        prTriggered = true;
      }
    }
  }

  persist();
  return { sessionTotal, prTriggered };
}

/* ---------------- custom exercises ---------------- */
function addCustomExercise(dateKey){
  const nameInput = document.getElementById(`custom-name-${dateKey}`);
  const setsInput = document.getElementById(`custom-sets-${dateKey}`);
  const repsInput = document.getElementById(`custom-reps-${dateKey}`);
  const name = (nameInput.value||'').trim();
  if(!name) return;
  const sets = Math.min(Math.max(parseInt(setsInput.value)||1,1),10);
  const reps = (repsInput.value||'').trim() || '-';
  const dayEntry = ensureDayEntry(dateKey);
  if(dayEntry.customExercises.some(c=>c.name.toLowerCase()===name.toLowerCase())) return;
  dayEntry.customExercises.push({ id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*1000), name, sets, reps });
  persist();
  if(currentView==='pastlog') renderPastLog(); else renderHome();
}

/* ---------------- body weight ---------------- */
function lastBodyWeightEntry(){
  if(data.bodyWeight.length===0) return null;
  return data.bodyWeight[data.bodyWeight.length-1];
}
function canLogBodyWeight(){
  const last = lastBodyWeightEntry();
  if(!last) return true;
  const days = diffDays(new Date(), parseDateKey(last.date));
  return days>=6;
}
function nextBodyWeightDate(){
  const last = lastBodyWeightEntry();
  if(!last) return null;
  return formatDateKey(addDays(parseDateKey(last.date), 6));
}
function saveBodyWeight(weightVal){
  if(!canLogBodyWeight()) return { ok:false, awarded:0 };
  data.bodyWeight.push({ date: formatDateKey(new Date()), weight: Number(weightVal) });
  awardPoints(BODYWEIGHT_LOG_REWARD, 'Body weight logged');
  persist();
  return { ok:true, awarded: BODYWEIGHT_LOG_REWARD };
}

function renderLineChart(entries){
  const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date));
  const weights = sorted.map(e=>Number(e.weight));
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = (maxW-minW)||1;
  const W=280,H=120,pad=10;
  const pts = sorted.map((e,i)=>{
    const x = pad + (i/(Math.max(sorted.length-1,1)))*(W-2*pad);
    const y = H-pad - ((Number(e.weight)-minW)/range)*(H-2*pad);
    return `${x},${y}`;
  });
  let svg = `<svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#39ff14" stroke-width="2"/>`;
  sorted.forEach((e,i)=>{
    const [x,y]=pts[i].split(',');
    svg += `<circle cx="${x}" cy="${y}" r="3" fill="#ffe600"/>`;
  });
  svg += `</svg><div class="page-sub">${sorted[0].weight} → ${sorted[sorted.length-1].weight} (kg/lb) over ${sorted.length} entries</div>`;
  return svg;
}

  <div class="page-sub">App preferences</div>
  <div class="card">
    <div class="row-between">
      <div>
        <h4>Allow Past-Day Entries</h4>
        <p class="page-sub" style="margin-top:4px;">Enable logging workouts for missed days.</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="past-toggle" ${data.settings.allowPastEntries?'checked':''} onchange="toggleAllowPast()">
        <span class="slider-el"></span>
      </label>
    </div>
  </div>
  <div class="card">
    <h4>About</h4>
    <p class="page-sub" style="margin-top:6px;">Preloaded exercises, sets, reps and rest times cannot be edited — you can only add extra custom exercises alongside them and log body weight. No entry can ever be deleted once saved. Your data is stored on this device (localStorage + IndexedDB) and is retained indefinitely, well beyond 12 months, unless you or your browser explicitly clears site data — a guarantee no purely on-device web app can override, especially in private/incognito windows.</p>
  </div>`;
  document.getElementById('app-content').innerHTML = html;
}
function toggleAllowPast(){
  data.settings.allowPastEntries = document.getElementById('past-toggle').checked;
  persist();
}

function render(){
  if(currentView==='home') renderHome();
  else if(currentView==='progress') renderProgress();
  else if(currentView==='upcoming') renderUpcoming();
  else if(currentView==='bodyweight') renderBodyWeight();
  else if(currentView==='points') renderPoints();
  else if(currentView==='settings') renderSettings();
  else if(currentView==='pastlog') renderPastLog();
}

/* ---------------- init ---------------- */
function initApp(){
  runPenaltyChecks();
  render();
  reconcileStorage();
  detectPrivateModeAndWarn();
}

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('fade-out');
    document.getElementById('app-root').style.display='flex';
    initApp();
    setTimeout(()=>{ document.getElementById('splash').remove(); }, 550);
  }, 2000);
});
</script>
</body>
</html>
