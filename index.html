<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ALPHA WORKOUT</title>
<style>
:root{
  --bg:#000000;
  --panel:#121212;
  --panel2:#1b1b1b;
  --border:#2a2a2a;
  --green:#39ff14;
  --green-dim:#1f8f0c;
  --yellow:#ffe600;
  --yellow-dim:#b3a000;
  --text:#e8e8e8;
  --text-dim:#9a9a9a;
  --danger:#ff5252;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Arial,sans-serif; height:100%; width:100%; -webkit-tap-highlight-color:transparent;}
body{min-height:100vh; overflow-x:hidden;}
#app-root{width:100%; min-height:100vh; position:relative; background:var(--bg); display:flex; flex-direction:column;}

/* ---------- Splash ---------- */
#splash{
  position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #0d0d0d 0%, #000 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999;
  transition:opacity .5s ease;
}
#splash.fade-out{opacity:0; pointer-events:none;}
.splash-logo{font-size:42px; font-weight:900; letter-spacing:3px; text-align:center;}
.splash-logo .alpha{color:var(--green); text-shadow:0 0 18px rgba(57,255,20,.6);}
.splash-logo .workout{color:var(--yellow); text-shadow:0 0 18px rgba(255,230,0,.5);}
.splash-sub{margin-top:10px; color:var(--text-dim); letter-spacing:4px; font-size:11px;}
.splash-bar-track{margin-top:28px; width:180px; height:4px; background:#222; border-radius:2px; overflow:hidden;}
.splash-bar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--green),var(--yellow)); animation:loadbar 2s linear forwards;}
@keyframes loadbar{ to{width:100%;} }

/* ---------- Name gate (first-run only) ---------- */
#name-gate{
  position:fixed; inset:0; background:#000; z-index:998; display:none; align-items:center; justify-content:center; padding:20px;
}
#name-gate .box{text-align:center; max-width:320px; width:100%;}
#name-gate p{color:var(--text-dim); margin:16px 0 18px; font-size:14px;}
#name-gate input{margin-bottom:14px; text-align:center;}

/* ---------- Private mode banner ---------- */
#private-banner{
  display:none; width:100%; background:var(--yellow); color:#000; font-weight:700; font-size:12.5px;
  text-align:center; padding:8px 14px;
}

/* ---------- Point scored animation ---------- */
#point-toast{
  position:fixed; top:76px; left:50%; transform:translate(-50%,-14px) scale(.8);
  background:linear-gradient(135deg,var(--green),var(--yellow)); color:#000; font-weight:900; font-size:22px;
  padding:14px 28px; border-radius:14px; box-shadow:0 0 34px rgba(57,255,20,.65); opacity:0;
  z-index:300; pointer-events:none; letter-spacing:1px; white-space:nowrap;
}
#point-toast.show{ animation: pointpop 2.6s ease forwards; }
@keyframes pointpop{
  0%{ opacity:0; transform:translate(-50%,-10px) scale(.8); }
  8%{ opacity:1; transform:translate(-50%,0) scale(1.08); }
  15%{ opacity:1; transform:translate(-50%,0) scale(1); }
  85%{ opacity:1; transform:translate(-50%,0) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-16px) scale(.95); }
}

/* ---------- Header ---------- */
#header{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; background:#000; border-bottom:1px solid var(--border); width:100%;
}
#header .brand{font-weight:900; letter-spacing:1px; font-size:18px; cursor:pointer;}
#header .brand .a{color:var(--green);}
#header .brand .w{color:var(--yellow);}
#hamburger-btn{background:none; border:1px solid var(--border); border-radius:8px; width:40px; height:36px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; cursor:pointer;}
#hamburger-btn span{display:block; width:20px; height:2px; background:var(--green);}

/* ---------- Slide menu ---------- */
#menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none;}
#menu-overlay.open{display:block;}
#side-menu{
  position:fixed; top:0; right:-300px; width:280px; height:100%; background:#0a0a0a; border-left:1px solid var(--border);
  z-index:90; transition:right .25s ease; display:flex; flex-direction:column; padding:18px;
}
#side-menu.open{right:0;}
#side-menu h3{color:var(--yellow); font-size:13px; letter-spacing:2px; margin-bottom:14px;}
.menu-item{
  display:flex; align-items:center; justify-content:space-between; padding:14px 10px; border-radius:8px; margin-bottom:6px;
  cursor:pointer; color:var(--text); border:1px solid transparent; transition:opacity .2s;
}
.menu-item:hover{background:var(--panel2); border-color:var(--border);}
.menu-item .arrow{color:var(--green);}
.menu-item.faded{opacity:.5;}
.menu-close{align-self:flex-end; background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; margin-bottom:6px;}

/* ---------- Content ---------- */
#app-content{flex:1; width:100%; max-width:1400px; margin:0 auto; padding:20px 24px 60px;}
.page-title{font-size:20px; font-weight:800; color:var(--green); margin-bottom:4px;}
.page-sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
.card h4{color:var(--yellow); font-size:15px; margin-bottom:2px;}
.tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--green); color:var(--green); margin-top:4px;}
.tag.done{background:var(--green); color:#000; border-color:var(--green); font-weight:700;}
.meta-row{display:flex; gap:14px; font-size:12px; color:var(--text-dim); margin:6px 0 10px; flex-wrap:wrap;}
.meta-row b{color:var(--text);}
.set-row{display:grid; grid-template-columns:36px 1fr 1fr; gap:8px; align-items:center; margin-bottom:6px;}
.set-row span{color:var(--text-dim); font-size:12px;}
.locked-val{background:#0e0e0e; border:1px solid var(--border); border-radius:6px; padding:8px; color:var(--text-dim); text-align:center; font-size:13px;}
input[type=number], input[type=text], input[type=date]{
  width:100%; background:#0e0e0e; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font-size:14px;
}
input:focus{outline:1px solid var(--green);}
.btn{
  background:linear-gradient(90deg,var(--green),var(--yellow)); color:#000; border:none; border-radius:8px;
  padding:10px 14px; font-weight:800; cursor:pointer; font-size:13px; letter-spacing:.5px;
}
.btn.secondary{background:none; border:1px solid var(--green); color:var(--green);}
.btn.small{padding:6px 10px; font-size:12px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.pill-group{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.pill{padding:7px 12px; border-radius:20px; border:1px solid var(--border); color:var(--text-dim); font-size:12px; cursor:pointer;}
.pill.active{border-color:var(--green); color:var(--green); font-weight:700;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
.stat-box .num{font-size:24px; font-weight:900;}
.stat-box .lbl{font-size:11px; color:var(--text-dim); margin-top:4px; letter-spacing:1px;}
.pos{color:var(--green);}
.neg{color:var(--yellow);}
.switch{position:relative; width:46px; height:24px; flex:0 0 auto;}
.switch input{opacity:0; width:0; height:0;}
.slider-el{position:absolute; cursor:pointer; inset:0; background:#333; border-radius:24px; transition:.2s;}
.slider-el:before{position:absolute; content:""; height:18px; width:18px; left:3px; bottom:3px; background:#ccc; border-radius:50%; transition:.2s;}
input:checked + .slider-el{background:var(--green-dim);}
input:checked + .slider-el:before{transform:translateX(22px); background:var(--green);}
.locked-box{opacity:.5; pointer-events:none;}
.log-entry{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.log-entry:last-child{border-bottom:none;}
.bar-chart{display:flex; align-items:flex-end; gap:4px; height:120px; margin:10px 0; overflow-x:auto;}
.bar{flex:0 0 auto; width:14px; background:linear-gradient(180deg,var(--green),var(--green-dim)); border-radius:3px 3px 0 0; position:relative;}
.bar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9px; color:var(--text-dim);}
.empty-msg{color:var(--text-dim); font-size:13px; text-align:center; padding:24px 0;}
svg.linechart{width:100%; height:140px;}
.footer-note{text-align:center; color:var(--text-dim); font-size:11px; margin-top:20px;}
.badge-locked{font-size:11px; color:var(--yellow); border:1px solid var(--yellow); padding:2px 8px; border-radius:20px; white-space:nowrap;}
.notice-card{border-color:var(--yellow);}
.notice-card p{color:var(--yellow); font-size:13px; margin:0;}
.cards-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:12px;}
@media(min-width:800px){ .cards-grid{grid-template-columns:1fr 1fr;} }
@media(min-width:1300px){ .cards-grid{grid-template-columns:1fr 1fr 1fr;} }
.version-tag{display:inline-block; font-size:11px; color:var(--text-dim); border:1px solid var(--border); padding:2px 8px; border-radius:20px; margin-bottom:10px;}
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:#333; border-radius:3px;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo"><span class="alpha">ALPHA</span> <span class="workout">WORKOUT</span></div>
  <div class="splash-sub">TRAIN. TRACK. TRANSFORM.</div>
  <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
</div>

<div id="name-gate">
  <div class="box">
    <div class="splash-logo" style="font-size:26px;"><span class="alpha">ALPHA</span> <span class="workout">WORKOUT</span></div>

<div id="point-toast"></div>

<div id="app-root" style="display:none;">

  <div id="header">
    <div class="brand" onclick="navigate('home')"><span class="a">ALPHA</span> <span class="w">WORKOUT</span></div>

  <div id="menu-overlay" onclick="toggleMenu(false)"></div>

    <button class="menu-close" onclick="toggleMenu(false)">&times;</button>

    <div id="menu-items"></div>

  <div id="app-content"></div>
</div>

<script>

const STORAGE_KEY = 'alphaWorkoutData_v1';
const IDB_NAME = 'AlphaWorkoutDB';

/* ---------------- changelog ---------------- */
const CHANGELOG = [
  { version:'1.0.3', items:[
    'The app now asks for your name once, right after the splash screen, and quietly starts your points at a clean 0.',
    'Logged sets and exercises are now locked once saved — you can still see them, but they can no longer be edited.',

/* ---------------- reward constants ---------------- */
const FIRST_ENTRY_BONUS = 10000;
const PER_SET_POINTS = 25;
const PR_REWARD = 2500;
const BODYWEIGHT_LOG_REWARD = 2500;
const BODYWEIGHT_MISS_PENALTY = 10000;
const GAP_PENALTY = 10000;      // 2+ continuous days with no exercise logged
const WEEKLY_MISS_PENALTY = 50000; // fewer than 5 workout days in a Mon-Sun week
const CARDIO_DAILY_CAP = 500;   // max points/day from calorie-based cardio logging

const TIERS = [
  { name:'Platinum', min:75000, color:'var(--green)' },
  { name:'Gold',      min:30000, color:'var(--yellow)' },
  { name:'Silver',    min:10000, color:'#c0c0c0' },
  { name:'Bronze',    min:-Infinity, color:'#a97142' }
];

/* ---------------- date utils ---------------- */
function formatDateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDateKey(key){
  const [y,m,d]=key.split('-').map(Number);
  return new Date(y,m-1,d);
}
function dayNameForDate(d){ return DAY_NAMES[d.getDay()]; }
function dayIndexMonBased(d){ return (d.getDay()+6)%7; } // Monday=0 ... Sunday=6
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function diffDays(a,b){
  const A=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const B=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);
}
function niceDate(key){
  const d=parseDateKey(key);
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function getSundayOfWeek(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay();
  return addDays(d,-day);
}
function getMondayOfWeek(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const day=d.getDay();
  const diff = (day===0)? -6 : 1-day;
  return addDays(d,diff);
}

/* ---------------- data layer (localStorage + IndexedDB dual persistence) ---------------- */
function defaultData(){
  return {
    createdAt: formatDateKey(new Date()),
    updatedAt: Date.now(),
    userName: null,
    nameCaptured: false,
    points: 0,
    pointsLog: [],
    bodyWeight: [],
    workouts: {},
    settings: { allowPastEntries:false },
    penalizedBodyWeightWeeks: [],
    evaluatedWeeks: [],
    gapPenaltyAppliedFor: null,
    forcedBronzeActive: false,
    firstEntryAwarded: false,
    newFeaturesSeen: false,
    skips: {}
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed);
  }catch(e){ return defaultData(); }
}
let data = loadData();

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB) return reject('no-idb');
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSave(obj){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(obj,'data');
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    });
  }catch(e){ return false; }
}
async function idbLoad(){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get('data');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    });
  }catch(e){ return null; }
}
function persist(){
  data.updatedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  idbSave(data);
}
async function reconcileStorage(){
  const idbData = await idbLoad();
  if(idbData && (idbData.updatedAt||0) > (data.updatedAt||0)){
    data = Object.assign(defaultData(), idbData);
    persist();
    render();
  } else {
    idbSave(data);
  }
}
function detectPrivateModeAndWarn(){
  try{
    localStorage.setItem('__pmtest__','1');
    localStorage.removeItem('__pmtest__');
  }catch(e){ showPrivateBanner(); return; }
  if(!window.indexedDB){ showPrivateBanner(); return; }
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(est=>{
      if(est && est.quota && est.quota < 120000000){ showPrivateBanner(); }
    }).catch(()=>{});
  }
}

function awardPoints(delta, reason){

}

/* ---------------- streak & tier ---------------- */
function computeStreak(){
  let count=0;
  let d=new Date(); d.setHours(0,0,0,0);
  while(true){
    const key=formatDateKey(d);
    const w=data.workouts[key];
    if(w && w.entries && Object.keys(w.entries).length>0){
      count++; d=addDays(d,-1);
    } else break;
  }
  return count;
}
function computeTier(){
  if(data.forcedBronzeActive) return TIERS[3];
  return TIERS.find(t=>data.points>=t.min);
}

/* ---------------- skip-a-day (workout rescheduling) ---------------- */
function getEffectivePlan(dateKey){
  const d = parseDateKey(dateKey);
  const monday = getMondayOfWeek(d);
  const weekKey = formatDateKey(monday);
  const idx = dayIndexMonBased(d);
  const originalDayName = WEEK_ORDER[idx];
  const skip = data.skips[weekKey];

  if(!skip || idx < skip.dayIndex){
    return { plan: WORKOUT_PLAN[originalDayName], note:null, isSkippedDay:false };
  }
  if(idx === skip.dayIndex){
    const nextName = WEEK_ORDER[idx+1] || 'next week';
    return { plan: { focus:'Skipped', exercises:[] }, note:`Skipped — rescheduled to ${nextName}`, isSkippedDay:true };
  }
  const sourceDayName = WEEK_ORDER[idx-1];
  return { plan: WORKOUT_PLAN[sourceDayName], note:`Rescheduled from ${sourceDayName}`, isSkippedDay:false };
}
function canSkipToday(now){
  const idx = dayIndexMonBased(now);
  if(idx===6) return { ok:false, reason:'Sunday is already a rest day — nothing to skip.' };
  const weekKey = formatDateKey(getMondayOfWeek(now));
  if(data.skips[weekKey]) return { ok:false, reason:'You already used your skip for this week. It resets Monday.' };
  return { ok:true };
}
function skipToday(){
  const now = new Date();
  const check = canSkipToday(now);
  if(!check.ok) return check;
  const weekKey = formatDateKey(getMondayOfWeek(now));
  data.skips[weekKey] = { dayIndex: dayIndexMonBased(now), skippedDate: formatDateKey(now), appliedAt: Date.now() };
  persist();
  return { ok:true };
}

/* ---------------- penalty engine ---------------- */
function bodyWeightWindow(sunday){
  // Sunday 7:00 AM through Monday 11:59:59 PM
  const start=new Date(sunday); start.setHours(7,0,0,0);
  const end=addDays(sunday,1); end.setHours(23,59,59,999);
  return {start,end};
}
function hasBodyWeightInWindow(start,end){
  return data.bodyWeight.some(e=>{
    const d=parseDateKey(e.date);
    const dt=new Date(d); dt.setHours(12,0,0,0);
    return dt>=start && dt<=end;
  });
}
function runBodyWeightPenaltyCheck(now){
  const currentSunday = getSundayOfWeek(now);
  const createdAtStart = parseDateKey(data.createdAt); // midnight of account-creation day
  for(let w=11; w>=0; w--){
    const sunday = addDays(currentSunday, -7*w);
    const weekKey = formatDateKey(sunday);
    const {start,end} = bodyWeightWindow(sunday);
    if(start < createdAtStart) continue; // don't penalize windows that began before the account existed
    if(end > now) continue;
    if(data.penalizedBodyWeightWeeks.includes(weekKey)) continue;
    if(!hasBodyWeightInWindow(start,end)){
      data.points -= BODYWEIGHT_MISS_PENALTY; // allowed to go negative, compounds week after week
      data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-BODYWEIGHT_MISS_PENALTY, reason:`Missed body weight window (week of ${weekKey})` });
    }
    data.penalizedBodyWeightWeeks.push(weekKey);
  }
}
function getLastWorkoutLogDate(){
  const keys = Object.keys(data.workouts).filter(k=>data.workouts[k].entries && Object.keys(data.workouts[k].entries).length>0);
  if(keys.length===0) return null;
  keys.sort();
  return parseDateKey(keys[keys.length-1]);
}
function runGapPenaltyCheck(now){
  const last = getLastWorkoutLogDate();
  const baseline = last || parseDateKey(data.createdAt);
  const baselineKey = formatDateKey(baseline);
  const today = new Date(now); today.setHours(0,0,0,0);
  const gap = diffDays(today, baseline);
  if(gap>=2 && data.gapPenaltyAppliedFor !== baselineKey){
    data.points -= GAP_PENALTY;
    data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-GAP_PENALTY, reason:'No exercise logged for 2+ continuous days' });
    data.gapPenaltyAppliedFor = baselineKey;
  }
}
function countLoggedDaysInWeek(monday){
  let count=0;
  for(let i=0;i<7;i++){
    const key=formatDateKey(addDays(monday,i));
    const w=data.workouts[key];
    if(w && w.entries && Object.keys(w.entries).length>0) count++;
  }
  return count;
}
function runWeeklyMinimumCheck(now){
  const currentMonday = getMondayOfWeek(now);
  const createdAtStart = parseDateKey(data.createdAt); // midnight of account-creation day
  for(let w=11; w>=0; w--){
    const monday = addDays(currentMonday, -7*w);
    if(monday < createdAtStart) continue; // don't penalize weeks that started before the account existed
    const weekKey = formatDateKey(monday);
    const weekEnd = addDays(monday,6); weekEnd.setHours(23,59,59,999);
    if(weekEnd > now) continue;
    if(data.evaluatedWeeks.includes(weekKey)) continue;
    const loggedDays = countLoggedDaysInWeek(monday);
    if(loggedDays < 5){
      data.points -= WEEKLY_MISS_PENALTY;
      data.pointsLog.unshift({ ts:new Date().toISOString(), delta:-WEEKLY_MISS_PENALTY, reason:`Missed weekly minimum — only ${loggedDays}/7 days logged (week of ${weekKey})` });
      data.forcedBronzeActive = true;
    } else if(data.forcedBronzeActive){
      data.forcedBronzeActive = false;
    }
    data.evaluatedWeeks.push(weekKey);
  }
}
function runPenaltyChecks(){
  const now = new Date();
  runBodyWeightPenaltyCheck(now);
  runGapPenaltyCheck(now);
  runWeeklyMinimumCheck(now);
  persist();
}

/* ---------------- workout logging ---------------- */
function ensureDayEntry(dateKey){
  if(!data.workouts[dateKey]){
    const dName = dayNameForDate(parseDateKey(dateKey));
    data.workouts[dateKey] = { day: dName, entries: {}, customExercises: [], awarded: {}, prAwarded: {}, cardioPointsAwarded: 0 };
  } else {
    const w = data.workouts[dateKey];
    w.customExercises = w.customExercises || [];
    w.awarded = w.awarded || {};
    w.prAwarded = w.prAwarded || {};
    w.cardioPointsAwarded = w.cardioPointsAwarded || 0;
  }
  return data.workouts[dateKey];
}
function checkOverload(exerciseName, dateKey, newMaxWeight){
  let priorMax = -Infinity;
  for(let i=1;i<=7;i++){
    const key = formatDateKey(addDays(parseDateKey(dateKey), -i));
    const w = data.workouts[key];
    if(w && w.entries && w.entries[exerciseName]){
      const m = Math.max(...w.entries[exerciseName].map(s=>Number(s.weight)||0));
      if(m>priorMax) priorMax=m;
    }
  }
  if(priorMax > -Infinity && newMaxWeight > priorMax){
    awardPoints(PR_REWARD, `New PR on ${exerciseName}!`);
    return true;
  }
  return false;
}
function findExerciseDef(exId, dateKey){
  const { plan } = getEffectivePlan(dateKey);
  let ex = plan.exercises.find(e=>e.id===exId);
  if(ex) return ex;
  const dayEntry = data.workouts[dateKey];
  if(dayEntry && dayEntry.customExercises){
    ex = dayEntry.customExercises.find(e=>e.id===exId);
  }
  return ex;
}
function isCalorieCardio(ex){
  return !!(ex && ex.type==='cardio' && ex.target && /calorie/i.test(ex.target));
}
function saveExercise(dateKey, exerciseName, type, sets, ex){
  const dayEntry = ensureDayEntry(dateKey);
  dayEntry.entries[exerciseName] = sets;
  let sessionTotal = 0;

  function grantFirstEntryIfNeeded(){
    if(!data.firstEntryAwarded){
      awardPoints(FIRST_ENTRY_BONUS, 'Welcome bonus — first entry logged!');
      sessionTotal += FIRST_ENTRY_BONUS;
      data.firstEntryAwarded = true;
    }
  }

  if(type==='strength'){
    const prevAwarded = dayEntry.awarded[exerciseName] || sets.map(()=>false);
    const newAwarded = sets.map((s,i)=> prevAwarded[i] || (Number(s.weight)>0 || Number(s.reps)>0));
    sets.forEach((s,i)=>{
      const filled = (Number(s.weight)>0 || Number(s.reps)>0);
      if(filled && !prevAwarded[i]){
        grantFirstEntryIfNeeded();
        awardPoints(PER_SET_POINTS, `Set ${i+1} — ${exerciseName}`);
        sessionTotal += PER_SET_POINTS;
      }
    });
    dayEntry.awarded[exerciseName] = newAwarded;
  } else {
    const already = dayEntry.awarded[exerciseName]===true;
    const rawVal = sets[0] && sets[0].value;
    const filled = String(rawVal||'').trim().length>0;
    if(filled && !already){
      grantFirstEntryIfNeeded();
      if(isCalorieCardio(ex)){
        const cal = Math.max(0, Math.round(Number(rawVal))||0);
        const remainingCap = Math.max(0, CARDIO_DAILY_CAP - dayEntry.cardioPointsAwarded);
        const grant = Math.min(cal, remainingCap);
        if(grant>0){
          awardPoints(grant, `${exerciseName} — ${cal} cal burned`);
          sessionTotal += grant;
          dayEntry.cardioPointsAwarded += grant;
        }
      } else {
        awardPoints(PER_SET_POINTS, `${exerciseName} logged`);
        sessionTotal += PER_SET_POINTS;
      }
      dayEntry.awarded[exerciseName] = true;
    }
  }

  let prTriggered = false;
  if(type==='strength'){
    const maxWeight = Math.max(...sets.map(s=>Number(s.weight)||0), 0);
    if(maxWeight>0 && !dayEntry.prAwarded[exerciseName]){
      const isPR = checkOverload(exerciseName, dateKey, maxWeight);
      if(isPR){
        dayEntry.prAwarded[exerciseName] = true;
        sessionTotal += PR_REWARD;
        prTriggered = true;
      }
    }
  }

  persist();
  return { sessionTotal, prTriggered };
}

/* ---------------- custom exercises ---------------- */
function addCustomExercise(dateKey){
  const nameInput = document.getElementById(`custom-name-${dateKey}`);
  const setsInput = document.getElementById(`custom-sets-${dateKey}`);
  const repsInput = document.getElementById(`custom-reps-${dateKey}`);
  const name = (nameInput.value||'').trim();
  if(!name) return;
  const sets = Math.min(Math.max(parseInt(setsInput.value)||1,1),10);

  const dayEntry = ensureDayEntry(dateKey);
  if(dayEntry.customExercises.some(c=>c.name.toLowerCase()===name.toLowerCase())) return;
  dayEntry.customExercises.push({ id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*1000), name, sets, reps });
  persist();
  if(currentView==='pastlog') renderPastLog(); else renderHome();
}

function exerciseCardHTML(ex, dateKey, savedSets, awardedState){
  let inner = '';
  let allLocked = false;
  if(ex.type==='strength'){
    inner = `<div class="meta-row"><span>Sets: <b>${ex.sets}</b></span><span>Reps: <b>${ex.reps}</b></span><span>Rest: <b>${ex.rest||'—'}</b></span></div>`;
    inner += `<div id="sets-${ex.id}-${dateKey}">`;
    let lockedCount = 0;
    for(let i=0;i<ex.sets;i++){
      const isLocked = !!(awardedState && awardedState[i]);
      if(isLocked){
        lockedCount++;
        const w = savedSets && savedSets[i] ? savedSets[i].weight : 0;
        const r = savedSets && savedSets[i] ? savedSets[i].reps : 0;
        inner += `<div class="set-row">
          <span>#${i+1}</span>
          <div class="locked-val">${w} kg 🔒</div>
          <div class="locked-val">${r} reps 🔒</div>
        </div>`;
      } else {
        const w = savedSets && savedSets[i] ? savedSets[i].weight : '';
        const r = savedSets && savedSets[i] ? savedSets[i].reps : '';
        inner += `<div class="set-row">
          <span>#${i+1}</span>
          <input type="number" min="0" placeholder="weight (kg)" id="w-${ex.id}-${dateKey}-${i}" value="${w}">
          <input type="number" min="0" placeholder="reps" id="r-${ex.id}-${dateKey}-${i}" value="${r}">
        </div>`;
      }
    }
    inner += `</div>`;
    allLocked = lockedCount === ex.sets;
  } else {
    const locked = awardedState===true;
    allLocked = locked;
    const calorie = isCalorieCardio(ex);
    inner = `<div class="meta-row"><span>Target: <b>${ex.target}</b></span>${calorie?`<span>Scoring: <b>1 pt / calorie (max ${CARDIO_DAILY_CAP}/day)</b></span>`:''}</div>`;
    const v = savedSets && savedSets[0] ? savedSets[0].value : '';
    if(locked){
      inner += `<div class="set-row" style="grid-template-columns:1fr;"><div class="locked-val">${v} 🔒</div></div>`;
    } else {
      inner += `<div class="set-row" style="grid-template-columns:1fr;">
        <input type="text" placeholder="${calorie?'calories burned':'e.g. minutes / reps done'}" id="c-${ex.id}-${dateKey}" value="${v}">
      </div>`;
    }
  }
  const saved = !!savedSets;
  return `<div class="card">
    <div class="row-between">
      <h4>${ex.name}</h4>
      <span class="tag ${saved?'done':''}">${saved?'✓ Logged':'Not logged'}</span>
    </div>
    ${inner}
    ${allLocked ? '' : `<div style="margin-top:8px;"><button class="btn small" onclick="handleSaveExercise('${ex.id}','${dateKey}','${ex.type}')">Save</button></div>`}
  </div>`;
}

    <input type="text" id="custom-name-${dateKey}" placeholder="Exercise name" style="margin-bottom:8px;">

function handleSaveExercise(exId, dateKey, type){
  const ex = findExerciseDef(exId, dateKey);
  if(!ex) return;
  const dayEntry = data.workouts[dateKey];
  const prevAwarded = dayEntry && dayEntry.awarded && dayEntry.awarded[ex.name];
  const prevSets = dayEntry && dayEntry.entries && dayEntry.entries[ex.name];
  let sets = [];
  if(type==='strength'){
    for(let i=0;i<ex.sets;i++){
      const locked = prevAwarded && prevAwarded[i];
      if(locked){
        sets.push(prevSets[i]);
      } else {
        const wEl = document.getElementById(`w-${ex.id}-${dateKey}-${i}`);
        const rEl = document.getElementById(`r-${ex.id}-${dateKey}-${i}`);
        sets.push({ weight: wEl ? (wEl.value||0) : 0, reps: rEl ? (rEl.value||0) : 0 });
      }
    }
  } else {
    const locked = prevAwarded===true;
    if(locked){
      sets = prevSets;
    } else {
      const vEl = document.getElementById(`c-${ex.id}-${dateKey}`);
      sets = [{ value: vEl ? vEl.value : '' }];
    }
  }
  const { sessionTotal } = saveExercise(dateKey, ex.name, type, sets, ex);
  runPenaltyChecks();
  triggerPointAnimation(sessionTotal);
  render();
}

    const { plan, note, isSkippedDay } = getEffectivePlan(dateKey);
    html += `<div class="card">
      <div class="row-between"><h4>${dName}</h4><span class="page-sub" style="margin:0;">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>
      <p class="page-sub" style="margin:4px 0 10px;">${plan.focus}</p>`;
    if(note){
      html += `<p style="color:var(--yellow); font-size:12px; margin:0 0 8px;">🔁 ${note}</p>`;
    }
    if(isSkippedDay){
      html += `<p class="empty-msg" style="padding:8px 0;">Skipped</p>`;
    } else if(plan.exercises.length===0){
      html += `<p class="empty-msg" style="padding:8px 0;">Rest day</p>`;
    } else {
      plan.exercises.forEach(ex=>{
        html += `<div class="log-entry"><span>${ex.name}</span><span style="color:var(--text-dim); font-size:12px;">${ex.type==='strength'?`${ex.sets} x ${ex.reps}`:ex.target}</span></div>`;
      });
    }
    html += `</div>`;
  }
  html += `</div>`;
  document.getElementById('app-content').innerHTML = html;
}

function renderProgress(){
  window._progressRange = window._progressRange || 7;
  const range = window._progressRange;
  const now = new Date();
  const start = addDays(now, -(range-1));

  let dateKeys = [];
  for(let i=0;i<range;i++) dateKeys.push(formatDateKey(addDays(start,i)));

  const counts = dateKeys.map(k=> data.workouts[k] ? Object.keys(data.workouts[k].entries).length : 0);
  const maxCount = Math.max(...counts, 1);

  let html = `<div class="page-title">Track Progress</div>
  <div class="page-sub">Workout consistency &amp; body weight trend</div>
  <div class="pill-group">
    ${[7,14,30,180].map(r=>`<div class="pill ${r===range?'active':''}" onclick="setProgressRange(${r})">${r===180?'6 months':r+' days'}</div>`).join('')}
  </div>
  <div class="card">
    <h4>Exercises Logged / Day</h4>
    <div class="bar-chart">`;
  dateKeys.forEach((k,i)=>{
    const h = Math.round((counts[i]/maxCount)*100);
    html += `<div class="bar-wrap"><div class="bar" style="height:${Math.max(h,3)}px;" title="${counts[i]}"></div><span>${parseDateKey(k).getDate()}</span></div>`;
  });
  html += `</div></div>`;

  const bwInRange = data.bodyWeight.filter(e=> dateKeys.includes(e.date) );
  html += `<div class="card"><h4>Body Weight Trend</h4>`;
  if(bwInRange.length===0){
    html += `<p class="empty-msg">No body weight entries in this range.</p>`;
  } else {
    html += renderLineChart(bwInRange);
  }
  html += `</div>`;

  html += `<div class="card"><h4>Workout History</h4><p class="page-sub" style="margin-top:-8px;">Tap a day to view exercises, sets and reps (view only).</p>`;
  const loggedDays = dateKeys.filter(k=>data.workouts[k] && Object.keys(data.workouts[k].entries).length>0).reverse();
  if(loggedDays.length===0){
    html += `<p class="empty-msg">No workouts logged in this range yet.</p>`;
  } else {
    loggedDays.forEach(k=>{
      const w = data.workouts[k];
      const expanded = !!(window._expandedHistory && window._expandedHistory[k]);
      html += `<div class="log-entry" style="flex-direction:column; align-items:stretch; cursor:pointer;" onclick="toggleHistoryDetail('${k}')">
        <div class="row-between"><span>${niceDate(k)} — ${w.day}</span><span>${Object.keys(w.entries).length} exercises ${expanded?'▲':'▼'}</span></div>
        ${expanded ? `<div style="margin-top:8px;">${renderHistoryDetail(k)}</div>` : ''}
      </div>`;
    });
  }
  html += `</div>`;

  document.getElementById('app-content').innerHTML = html;
}
function setProgressRange(r){ window._progressRange = r; renderProgress(); }
function toggleHistoryDetail(k){
  window._expandedHistory = window._expandedHistory || {};
  window._expandedHistory[k] = !window._expandedHistory[k];
  renderProgress();
}
function renderHistoryDetail(dateKey){
  const w = data.workouts[dateKey];
  if(!w) return '';
  let html = '';
  Object.keys(w.entries).forEach(name=>{
    const sets = w.entries[name];
    let detail;
    if(sets[0] && Object.prototype.hasOwnProperty.call(sets[0],'value')){
      detail = sets.map(s=>s.value).join(', ');
    } else {
      detail = sets.map((s,i)=>`Set ${i+1}: ${s.weight||0}kg × ${s.reps||0}`).join(' · ');
    }
    html += `<div style="padding:6px 0; border-bottom:1px solid var(--border);">
      <div style="color:var(--yellow); font-size:13px;">${name}</div>
      <div style="color:var(--text-dim); font-size:12px; margin-top:2px;">${detail}</div>
    </div>`;
  });
  return html;
}

function renderLineChart(entries){
  const sorted = [...entries].sort((a,b)=>a.date.localeCompare(b.date));
  const weights = sorted.map(e=>Number(e.weight));
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = (maxW-minW)||1;
  const W=280,H=120,pad=10;
  const pts = sorted.map((e,i)=>{
    const x = pad + (i/(Math.max(sorted.length-1,1)))*(W-2*pad);
    const y = H-pad - ((Number(e.weight)-minW)/range)*(H-2*pad);
    return `${x},${y}`;
  });
  let svg = `<svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="#39ff14" stroke-width="2"/>`;
  sorted.forEach((e,i)=>{
    const [x,y]=pts[i].split(',');
    svg += `<circle cx="${x}" cy="${y}" r="3" fill="#ffe600"/>`;
  });
  svg += `</svg><div class="page-sub">${sorted[0].weight} → ${sorted[sorted.length-1].weight} (kg/lb) over ${sorted.length} entries</div>`;
  return svg;
}

function renderBodyWeight(){
  const canLog = canLogBodyWeight();
  const last = lastBodyWeightEntry();
  const nextDate = nextBodyWeightDate();

  let html = `<div class="page-title">Body Weight</div>
  <div class="page-sub">Logging rewards +${BODYWEIGHT_LOG_REWARD.toLocaleString()} points, then locks for 6 days. Miss the Sunday 7:00 AM – Monday 11:59 PM window and you lose ${BODYWEIGHT_MISS_PENALTY.toLocaleString()} points — and it can go negative and compound further each week you keep missing it. Entries can never be deleted or edited.</div>`;

  html += `<div class="card ${canLog?'':'locked-box'}">
    <div class="row-between"><h4>Enter Body Weight</h4>${canLog?'':`<span class="badge-locked">Locked</span>`}</div>
    <div style="margin-top:8px;">
      <input type="number" id="bw-input" placeholder="Weight (kg)" ${canLog?'':'disabled'}>
    </div>
    <div style="margin-top:8px;">
      <button class="btn small" onclick="handleSaveBodyWeight()" ${canLog?'':'disabled'}>Save</button>
    </div>
    ${canLog?'':`<p class="page-sub" style="margin-top:8px;">You can view your history below. Next entry available: ${nextDate?niceDate(nextDate):'—'}</p>`}
  </div>`;

  html += `<div class="card"><h4>History</h4>`;
  if(data.bodyWeight.length===0){
    html += `<p class="empty-msg">No entries yet.</p>`;
  } else {
    [...data.bodyWeight].reverse().forEach(e=>{
      html += `<div class="log-entry"><span>${niceDate(e.date)}</span><span>${e.weight}</span></div>`;
    });
  }
  html += `</div>`;

  document.getElementById('app-content').innerHTML = html;
}
function handleSaveBodyWeight(){
  const val = document.getElementById('bw-input').value;
  if(!val || Number(val)<=0) return;
  const result = saveBodyWeight(val);
  if(result.ok){
    runPenaltyChecks();
    triggerPointAnimation(result.awarded);
    renderBodyWeight();
  }
}

function renderPoints(){
  const streak = computeStreak();
  const tier = computeTier();
  let html = `<div class="page-title">Points &amp; Rewards</div>
  <div class="page-sub">Earn points by staying consistent. Lose points for missing entries.</div>
  <div class="stat-grid">
    <div class="stat-box"><div class="num ${data.points>=0?'pos':'neg'}">${data.points.toLocaleString()}</div><div class="lbl">TOTAL POINTS</div></div>
    <div class="stat-box"><div class="num pos">${streak}</div><div class="lbl">DAY STREAK</div></div>
  </div>
  <div class="card" style="text-align:center;">
    <div class="page-sub" style="margin-bottom:6px;">CURRENT TIER</div>
    <div style="font-size:26px; font-weight:900; color:${tier.color};">${tier.name}</div>
    ${data.forcedBronzeActive?`<p class="page-sub" style="margin-top:6px;">Locked to Bronze — you missed the weekly minimum of 5 workout days. Log 5+ days this week to recover.</p>`:''}
  </div>
  <div class="card">
    <h4>How to earn</h4>
    <p class="page-sub" style="margin-top:6px;">+${FIRST_ENTRY_BONUS.toLocaleString()} pts one-time bonus on your very first entry &nbsp;•&nbsp; +${PER_SET_POINTS} pts per set / exercise logged &nbsp;•&nbsp; +${PR_REWARD.toLocaleString()} pts for a new PR (heavier than any lift in the last 7 days) &nbsp;•&nbsp; +${BODYWEIGHT_LOG_REWARD.toLocaleString()} pts every time you log body weight &nbsp;•&nbsp; Cardio &amp; Stairmaster: 1 pt per calorie burned, capped at ${CARDIO_DAILY_CAP}/day</p>
    <h4 style="margin-top:10px;">How you lose points</h4>
    <p class="page-sub" style="margin-top:6px;">-${BODYWEIGHT_MISS_PENALTY.toLocaleString()} pts for missing the body weight window (Sun 7AM–Mon 11:59PM) — can go negative and compounds every week it's missed &nbsp;•&nbsp; -${GAP_PENALTY.toLocaleString()} pts for 2+ continuous days with no exercise logged &nbsp;•&nbsp; -${WEEKLY_MISS_PENALTY.toLocaleString()} pts and an immediate drop to Bronze tier for logging fewer than 5 workout days in a week</p>
  </div>
  <div class="card"><h4>Activity Log</h4>`;
  if(data.pointsLog.length===0){
    html += `<p class="empty-msg">No point activity yet. Log a workout to get started.</p>`;
  } else {
    data.pointsLog.slice(0,60).forEach(l=>{
      const dt = new Date(l.ts);
      html += `<div class="log-entry"><span>${l.reason}<br><span style="color:var(--text-dim); font-size:11px;">${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></span><span class="${l.delta>=0?'pos':'neg'}">${l.delta>0?'+':''}${l.delta.toLocaleString()}</span></div>`;
    });
  }
  html += `</div>`;
  document.getElementById('app-content').innerHTML = html;
}

function renderNewFeatures(){
  let html = `<div class="page-title">What's New</div>
  <div class="page-sub">Recent updates to ALPHA WORKOUT</div>`;
  CHANGELOG.forEach(entry=>{
    html += `<div class="card">
      <span class="version-tag">v${entry.version}</span>
      <div>`;
    entry.items.forEach(item=>{
      html += `<div class="log-entry"><span>${item}</span></div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('app-content').innerHTML = html;
}

function renderSettings(){
  const now = new Date();
  const skipCheck = canSkipToday(now);
  let html = `<div class="page-title">Settings</div>
  <div class="page-sub">App preferences — version ${APP_VERSION}</div>
  <div class="card">
    <div class="row-between">
      <div>
        <h4>Allow Past-Day Entries</h4>
        <p class="page-sub" style="margin-top:4px;">Enable logging workouts for missed days.</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="past-toggle" ${data.settings.allowPastEntries?'checked':''} onchange="toggleAllowPast()">
        <span class="slider-el"></span>
      </label>
    </div>
  </div>
  <div class="card ${skipCheck.ok?'':'locked-box'}">
    <div class="row-between"><h4>Skip a Day</h4>${skipCheck.ok?'':'<span class="badge-locked">Locked</span>'}</div>
    <p class="page-sub" style="margin:4px 0 10px;">Can't make it to the gym today? Skip today's workout — it moves to tomorrow, and every day after shifts forward too. Your rest day gets used up this week instead of carrying over. One skip per week, resets Monday.</p>
    <button class="btn small" onclick="handleSkipToday()" ${skipCheck.ok?'':'disabled'}>Skip Today's Workout</button>
    ${skipCheck.ok?'':`<p class="page-sub" style="margin-top:8px;">${skipCheck.reason}</p>`}
  </div>
  <div class="card">
    <h4>About</h4>
    <p class="page-sub" style="margin-top:6px;">Signed in as <b style="color:var(--text);">${data.userName||'—'}</b></p>
    <p class="page-sub" style="margin-top:6px;">Preloaded exercises, sets, reps and rest times cannot be edited — you can only add extra custom exercises alongside them and log body weight. Once a set or exercise is logged it's locked and can't be edited, though you can still see it. Your data is stored on this device (localStorage + IndexedDB) and is retained indefinitely, well beyond 12 months, unless you or your browser explicitly clears site data — a guarantee no purely on-device web app can override, especially in private/incognito windows.</p>
  </div>`;
  document.getElementById('app-content').innerHTML = html;
}
function toggleAllowPast(){
  data.settings.allowPastEntries = document.getElementById('past-toggle').checked;
  persist();
}
function handleSkipToday(){
  const check = canSkipToday(new Date());
  if(!check.ok) return;
  if(!confirm("Skip today's workout? It will move to tomorrow and cascade through the rest of this week — your rest day will be used up instead. You can only do this once a week.")) return;
  const result = skipToday();
  if(result.ok) renderSettings();
}

function render(){
  if(currentView==='home') renderHome();
  else if(currentView==='newfeatures') renderNewFeatures();
  else if(currentView==='progress') renderProgress();
  else if(currentView==='upcoming') renderUpcoming();
  else if(currentView==='bodyweight') renderBodyWeight();
  else if(currentView==='points') renderPoints();
  else if(currentView==='settings') renderSettings();
  else if(currentView==='pastlog') renderPastLog();
}

/* ---------------- init ---------------- */
function initAppCore(){
  runPenaltyChecks();
  renderMenu();
  render();
  reconcileStorage();
  detectPrivateModeAndWarn();
}

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('fade-out');
    document.getElementById('app-root').style.display='flex';
    setTimeout(()=>{ document.getElementById('splash').remove(); }, 550);
    if(!data.nameCaptured){
      document.getElementById('name-gate').style.display='flex';
    } else {
      initAppCore();
    }
  }, 2000);
});
</script>
